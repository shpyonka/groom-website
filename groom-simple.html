<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROOM - Груминг студия</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body { 
            font-family: 'Arial', sans-serif; 
            background: #fff;
            color: #212529;
            min-height: 100vh;
        }
        .header {
            background: #fff;
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid #f8f9fa;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #212529;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.3s;
        }
        .logo:hover {
            color: #e4b8dc;
        }
        .nav { 
            display: flex; 
            gap: 2rem; 
        }
        .nav-link { 
            color: #6c757d; 
            text-decoration: none; 
            font-size: 1.1rem;
            transition: all 0.3s;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
        }
        .nav-link:hover {
            color: #e4b8dc;
            background: rgba(228, 184, 220, 0.1);
        }
        .btn {
            padding: 12px 28px;
            background: transparent;
            border: 2px solid #e4b8dc;
            color: #e4b8dc;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn:hover {
            background: #e4b8dc;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(228, 184, 220, 0.3);
        }
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            text-align: center;
        }
        .hero-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.7) 0%, rgba(70, 102, 108, 0.8) 100%),
                url('/images/Fon1.webp') center/cover;
            z-index: -1;
        }
        .hero-content {
            max-width: 800px;
            padding: 0 20px;
        }
        .hero-title {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            line-height: 1.1;
            background: linear-gradient(45deg, #2563eb, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-subtitle {
            font-size: 1.3rem;
            margin-bottom: 2.5rem;
            opacity: 0.9;
            color: #212529;
        }
        .hero-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-large {
            padding: 15px 40px;
            font-size: 1.2rem;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #e4b8dc;
            color: #e4b8dc;
        }
        .btn-outline:hover {
            background: #e4b8dc;
            color: white;
        }
        .section {
            padding: 80px 0;
        }
        .section-title {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 3rem;
            color: #212529;
            font-weight: 700;
        }
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }
        .feature-card {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s;
            border: 1px solid #e9ecef;
        }
        .feature-card:hover {
            transform: translateY(-5px);
        }
        .feature-card h3 {
            color: #212529;
            margin-bottom: 1rem;
            font-size: 1.3rem;
            font-weight: 700;
        }
        .feature-card p {
            color: #495057;
            line-height: 1.5;
        }
        .cta-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            text-align: center;
            padding: 4rem 0;
        }
        .cta-section h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #212529;
        }
        .cta-section p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;
        
        function Header() {
            return (
                <header className="header">
                    <div className="container">
                        <div className="header-content">
                            <a href="#main" className="logo">
                                GROOM
                            </a>
                            <nav className="nav">
                                <a href="#main" className="nav-link">Главная</a>
                                <a href="#features" className="nav-link">Преимущества</a>
                                <a href="#cta" className="nav-link">Контакты</a>
                            </nav>
                            <button className="btn">Записаться</button>
                        </div>
                    </div>
                </header>
            );
        }
        
        function Hero() {
            return (
                <section className="hero" id="main">
                    <div className="hero-background"></div>
                    <div className="hero-content">
                        <h1 className="hero-title">
                            ПРЕМИАЛЬНЫЙ ГРУМИНГ<br />
                            ДЛЯ ВАШИХ ПИТОМЦЕВ
                        </h1>
                        <p className="hero-subtitle">
                            Профессиональный уход, стильные стрижки и забота о ваших любимцах.<br />
                            Опытные грумеры с любовью к животным.
                        </p>
                        <div className="hero-buttons">
                            <button className="btn btn-large">Наши услуги</button>
                            <button className="btn btn-large">Наши грумеры</button>
                        </div>
                    </div>
                </section>
            );
        }
        
        function Features() {
            return (
                <section className="section" id="features">
                    <div className="container">
                        <h2 className="section-title">Почему выбирают нас</h2>
                        <div className="features-grid">
                            <div className="feature-card">
                                <h3>Профессионализм</h3>
                                <p>Опытные грумеры с международными сертификатами и многолетним опытом работы</p>
                            </div>
                            <div className="feature-card">
                                <h3>Забота и внимание</h3>
                                <p>Бережное отношение к каждому питомцу, индивидуальный подход и комфортная атмосфера</p>
                            </div>
                            <div className="feature-card">
                                <h3>Гарантия качества</h3>
                                <p>Строгие стандарты качества и 100% удовлетворенность наших клиентов и их питомцев</p>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }
        
        function App() {
            return (
                <div>
                    <Header />
                    <Hero />
                    <Features />
                    <section className="cta-section" id="cta">
                        <div className="container">
                            <h2>Готовы преобразить вашего питомца?</h2>
                            <p>Запишитесь на груминг прямо сейчас и получите скидку 15% на первую стрижку!</p>
                            <button className="btn btn-large" style={{marginTop: '1rem'}}>
                                Записаться онлайн
                            </button>
                        </div>
                    </section>
                </div>
            );
        }
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
